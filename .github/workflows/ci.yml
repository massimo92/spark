name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck

      - name: Check generated spark artifact
        run: scripts/build-single-file.sh --check

      - name: Check shell syntax
        run: bash -n spark install.sh tests/run.sh scripts/build-single-file.sh

      - name: Run ShellCheck
        run: shellcheck --exclude=SC2059,SC2015,SC2016 spark install.sh tests/run.sh scripts/build-single-file.sh

      - name: Run tests
        run: bash tests/run.sh
